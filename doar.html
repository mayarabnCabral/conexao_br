<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
    <title>Conexão BR - Início</title>
</head>

<body>
    <!-- Início do cabeçalho -->
    <header class="menu">
        <nav class="nav-container" aria-label="Navegação principal">
            <div class="logo-wrapper">
                <a href="index.html">
                    <img src="midia/logo_branco-removebg-preview.webp"
                        alt="Logotipo circular da ONG Conexão BR nas cores verde, azul e amarelo. O emblema inclui três figuras humanas estilizadas e interligadas em círculo, um livro aberto com pássaros voando no topo, uma ponte, folhas e uma bússola com a bandeira do Brasil"
                        class="logo-nav">
                </a>
            </div>

            <button class="menu-toggle" id="menuToggle" type="button" aria-label="Abrir menu de navegação" aria-expanded="false">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>

            <ul class="nav-links" id="navLinks">
                                            <!--indica qual pagina o usuário está (Acessibilidade)-->
                <li><a href="index.html" aria-current="page">Início</a></li>
                <li><a href="sobre.html">Sobre Nós</a></li>
                <li><a href="doar.html">Doar</a></li>
                <li><a href="inscrever.html">Inscrever-se</a></li>
            </ul>

            <div class="links-nav" aria-label="Redes sociais do desenvolvedor">
                <a href="https://github.com/mayarabnCabral/conexao_br" target="_blank" rel="noopener noreferrer" aria-label="Perfil do GitHub">
                    <i class="devicon-github-original" aria-hidden="true"></i>
                </a>
            </div>
        </nav>
    </header>
    <!-- Fim do cabeçalho -->
    <!--Inicio config formulario -->
    <main>
        <form class="doar-content infos-doar">
            <h1 class="titulo-doar">Doe</h1>

            <div>
                <div>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Seu nome (se desejar)">
            </div>
            <br>

            <div class="grupo-doc">
                <label for="CPF">
                    <input type="radio" name="documento" value="CPF">CPF
                </label>

                <label for="CNPJ">
                    <input type="radio" name="documento" value="CNPJ">CNPJ
                </label>
            </div><br>

            <div>
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="e-mail@gmail.com">
            </div><br>

            <div>
                <label for="valor">Valor da Doação:</label>
                <input type="number" id="valor" name="valor" placeholder="00,00" required>
            </div><br>

            <div>
                <label for="metodo">Método de Pagamento:</label>
                <select id="metodo" name="metodo" required>
                    <option value="">Selecione</option>
                    <option value="cartaoCredito">Cartão de Crédito</option>
                    <option value="cartaoDebito">Cartão de Débito</option>
                    <option value="pix">PIX</option>
                    <option value="boleto">Boleto Bancário</option>
                </select>
            </div><br>
            </div>

            <button class="btn-doar" type="submit">Doar</button>
        </form>
    </main>
    <!--Fim config formulario -->
</body>

</html>
